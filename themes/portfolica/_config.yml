# FAQ 区
faqs:
  # 问题
  - question: How do we get started?
    # 回答
    answer: Simply reach out via the contact form or schedule a call. We'll discuss your project requirements, timeline, and budget to ensure we're the right fit.
  - question: Can you redesign my existing website or app?
    answer: Absolutely! I specialize in redesigning existing digital products to improve user experience, conversion rates, and overall aesthetics.
  - question: Do you also handle development or just design?
    answer: I offer both design and development services — from UI/UX design to fully functional websites and web applications.
  - question: What tools do you use for design?
    answer: My primary tools include Figma for UI/UX design, Adobe Creative Suite for branding, and the modern web stack for implementation.
  - question: Can I request additional revisions?
    answer: Yes, all projects include revision rounds. The number depends on the project scope, but I always ensure we reach a result you're happy with.

