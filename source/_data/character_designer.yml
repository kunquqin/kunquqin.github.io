profile: 3D角色设计
intro: 拥有 10+ 年设计经验，动画专业背景，参与虚拟数字人、三维资产与 IP 视觉项目。在哔哩哔哩幻星项目中负责角色视觉、3D 美术资产与制作管线，协同原画、3D 美术及技术团队推进角色落地。关注角色风格的一致性、模型与材质的表现品质，并将 AI 用于前期概念探索与视觉方案迭代。
contact: 如果你正在寻找 3D 角色、虚拟形象或 AI 辅助美术流程方面的合作，欢迎直接联系我。
