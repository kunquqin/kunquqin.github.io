slides:
  - title: 从品牌形象，到学习体验。
    lead: 围绕背单词场景，构建亲切的角色形象、品牌语言与界面体验，用一致的视觉表达连接产品与用户。
  - title: 让日常提醒，更有温度。
    lead: 从桌面工具的视觉风格、信息层级到动效反馈，让提醒清晰易读，也让工作中的片刻休息更有温度。
  - title: 让数字角色，有自己的个性。
    lead: 从角色形象到 3D 内容，构建虚拟数字人视觉体系，并通过制作规范与 AIGC 工作流，兼顾创意品质与生产效率。
